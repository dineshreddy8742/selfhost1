[global]
type=global
user_agent=Dograh-Asterisk-Gateway
endpoint_identifier_order=ip,anonymous,username

; ─── Network Transport ──────────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16

; ─── Anonymous Fallback Endpoint ────────────────────────────────────────────
[anonymous]
type=endpoint
context=from-external
disallow=all
allow=ulaw
direct_media=no

; ─── Include Dynamic Trunks ──────────────────────────────────────────────────
#include pjsip.d/*.conf
